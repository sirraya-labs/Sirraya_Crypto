[package]
name = "sirraya-crypto"
version = "0.1.0"
edition = "2021"
description = "Post-quantum & hybrid digital signatures (FIPS 204 ML-DSA family)"
license = "MIT"
authors = ["Sirraya Labs"]
repository = "https://github.com/sirraya-labs/sirraya_crypto"

[dependencies]
sha3 = "0.10"                                             # SHAKE128/256 (FIPS 204 §3.7)
rand_core = { version = "0.6", features = ["getrandom"] } # OsRng for KeyGen (Alg 1)
hex = "0.4.3"                                             # CLI key/sig encoding

[features]
default = []
# Prints raw secret-key material (s1, s2, t0, K seed, tr) to stdout —
# unconditional secret exposure into scrollback/logs/CI. Off by default so
# a downstream `cargo add sirraya-crypto` can't reach it by accident, and
# so dependency-review tooling flags it if a consumer ever turns it on.
# See dsa::ml_dsa::core::diagnostic's module doc.
diagnostic-unsafe = []
# Reserved for masked (side-channel-hardened) implementations of the
# sampling/packing gadgets. No additional dependencies yet — enable and
# extend as that work lands.
masking = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "sirraya-crypto"
path = "src/main.rs"