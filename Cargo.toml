[package]
name = "sirraya-crypto"
version = "0.1.3"
edition = "2021"
description = "Post-quantum, classical & hybrid digital signatures (FIPS 204 ML-DSA, FIPS 205 SLH-DSA, Ed25519)"
license = "MIT"
authors = ["Sirraya Labs"]
repository = "https://github.com/sirraya-labs/sirraya_crypto"

[dependencies]
sha3 = "0.10"                                             # SHAKE128/256 (FIPS 204 §3.7); SLH-DSA SHAKE + pre-hash (FIPS 205 §11.1, §10.2.2)
sha2 = "0.10"                                             # SLH-DSA SHA2 instantiation (FIPS 205 §11.2) + pre-hash (§10.2.2)
hmac = "0.12"                                             # SLH-DSA PRF_msg under SHA2 (FIPS 205 §11.2.1/11.2.2)
rand_core = { version = "0.6", features = ["getrandom"] } # OsRng for KeyGen (Alg 1); also used directly for Ed25519 seed generation
hex = "0.4.3"                                             # CLI key/sig encoding
# classical Ed25519 (RFC 8032) — the Hybrid<PQ, classical> transition partner.
# Deliberately NOT hand-rolled, unlike ML-DSA/SLH-DSA: curve25519 field
# arithmetic is exactly the kind of primitive where a mature, widely-used,
# externally-reviewed implementation is the credible choice over a from-
# scratch one — see dsa::ed25519 module docs. Pinned to the 2.x line (not
# 3.0) specifically because it shares this crate's existing rand_core 0.6.x
# and sha2 0.10.x, avoiding a duplicate major-version dependency tree.
# default-features disabled (drops only "fast", i.e. curve25519-dalek's
# precomputed-tables perf optimization — correctness-neutral) specifically
# to keep pkcs8/spki/base64ct (and their newer-edition requirements) out
# of the dependency graph entirely, since this crate has no PKCS#8/PEM
# encoding feature and doesn't need them. Pinned to =2.1.1 (not the latest
# 2.2.x patch) purely because 2.2.0+ raised ed25519-dalek's own MSRV to
# 1.81, above this development toolchain's rustc 1.75 — no functional
# reason to avoid 2.2.x otherwise; bump this pin freely on a newer
# toolchain.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "rand_core", "zeroize"] }
zeroize = "=1.8.1"                                        # transitive dep of curve25519-dalek/ed25519-dalek; pinned below 1.9 only
                                                           # because this development toolchain's cargo (1.75) predates Rust's
                                                           # edition2024, which zeroize >=1.9 requires — not a statement about which
                                                           # zeroize version is actually correct for a production build. Whoever
                                                           # builds this crate on a current toolchain should feel free to drop this
                                                           # pin (or bump it) once that constraint no longer applies to them.
base64ct = "=1.6.0"                                       # transitive dep (via ed25519/pkcs8, itself pulled in despite this crate
                                                           # requesting no pkcs8/pem feature — see note above zeroize). base64ct
                                                           # >=1.7 requires edition2024, same toolchain constraint as zeroize above.

[dev-dependencies]
serde = { version = "1", features = ["derive"] } # ACVP KAT vector parsing (tests/acvp_kat.rs)
serde_json = "1"                                 # ACVP KAT vector parsing (tests/acvp_kat.rs)

[features]
default = []
# Prints raw secret-key material (s1, s2, t0, K seed, tr) to stdout —
# unconditional secret exposure into scrollback/logs/CI. Off by default so
# a downstream `cargo add sirraya-crypto` can't reach it by accident, and
# so dependency-review tooling flags it if a consumer ever turns it on.
# See dsa::ml_dsa::core::diagnostic's module doc.
diagnostic-unsafe = []
# Reserved for masked (side-channel-hardened) implementations of the
# sampling/packing gadgets. No additional dependencies yet — enable and
# extend as that work lands.
masking = []

[[test]]
name = "acvp_kat"
path = "tests/acvp_kat.rs"
# ACVP KAT vectors (tests/vectors/*.json) are ~2.5 MB total — this test
# target is separate from the default lib/bin unit tests so `cargo test`
# still runs it (autotests would too, but this is explicit since the crate
# sets autotests = false via the [package] defaults cargo publish emits).

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "sirraya-crypto"
path = "src/main.rs"
